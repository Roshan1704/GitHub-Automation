name: GitHub QA Automation Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly regression at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  qa-automation:
    name: QA Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [ chrome, firefox ]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@latest

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest

      - name: Run QA Tests - ${{ matrix.browser }}
        run: |
          mvn clean test \
            -Dbrowser=${{ matrix.browser }} \
            -Dallure.results.directory=allure-results

      - name: Publish Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-${{ matrix.browser }}
          path: target/logs

  release-readiness-gate:
    name: Release Readiness Check
    runs-on: ubuntu-latest
    needs: qa-automation
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Release Readiness Gate
        run: |
          mvn test -Dgate=true
        continue-on-error: true

      - name: Comment PR with Gate Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const gateStatus = fs.readFileSync('gate-status.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Release Readiness\n${gateStatus}`
            });

  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [ qa-automation, release-readiness-gate ]
    if: always()
    
    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "QA Automation Suite Results",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub QA Test Results*\n${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  scheduled-report:
    name: Daily Test Report
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *'
    
    steps:
      - name: Generate Test Trend Report
        run: |
          echo "Generating daily test report..."
          # This would aggregate test results from past 7 days
          # and generate trend analysis

      - name: Send Email Report
        run: |
          echo "Sending email report to stakeholders..."
          # Send automated report via email
